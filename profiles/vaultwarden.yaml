vaultwarden:
  inherit: base
  env:
    HEALTHCHECKS_UUID: "your-healthchecks-uuid-here"

  backup:
    source: 
      - {{ .Env.HOME }}/compose/vaultwarden
      - {{ .Env.HOME }}/appdata/vaultwarden
    exclude:
      - {{ .Env.HOME }}/appdata/vaultwarden/tmp
      - {{ .Env.HOME }}/appdata/vaultwarden/icon_cache
