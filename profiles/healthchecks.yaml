healthchecks:
  inherit: base
  env:
    HEALTHCHECKS_UUID: "your-healthchecks-uuid-here"

  backup:
    source: 
      - {{ .Env.HOME }}/compose/healthchecks
      - {{ .Env.HOME }}/appdata/healthchecks
    schedule: 06:00

  retention: 
{{ template "retention-iron" . }}

  forget:
{{ template "retention-iron" . }}