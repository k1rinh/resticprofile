umami:
  inherit: base
  env:
    HEALTHCHECKS_UUID: "your-healthchecks-uuid-here"

  backup:
    stdin: true
    stdin-filename: "umami-postgresql-db.sql"
    stdin-command: >-
      docker exec -t umami-db-1
      pg_dumpall --clean --if-exists --username umami
    schedule: 01,07,13,19:00

  retention: 
{{ template "retention-silver" . }}

  forget:
{{ template "retention-silver" . }}